name: Sync upstream

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/LotroCompanion/lotro-values.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Force-sync master with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/workflow"
          cp .github/workflows/sync-upstream.yml "$RUNNER_TEMP/workflow/sync-upstream.yml"
          git reset --hard upstream/master
          mkdir -p .github/workflows
          cp "$RUNNER_TEMP/workflow/sync-upstream.yml" .github/workflows/sync-upstream.yml
          git add .github/workflows/sync-upstream.yml
          git commit -m "Keep sync-upstream workflow" || echo "No workflow change needed"

      - name: Force push
        run: git push --force-with-lease origin HEAD:master